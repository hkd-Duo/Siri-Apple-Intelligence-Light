<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Siri Apple Intelligence Light — 输入框跑马灯演示</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 24px; background: #101014; color: #e8e8ea;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  h1 { font-size: 17px; font-weight: 600; opacity: .85; margin: 0; }
  p.hint { font-size: 12px; opacity: .45; margin: 0; }
  .controls button { appearance: none; border: 1px solid rgba(128,128,128,.4); background: transparent;
    color: inherit; border-radius: 999px; padding: 8px 18px; cursor: pointer; font-size: 13px; }
  .controls button:hover { border-color: #64d2ff; color: #64d2ff; }

  /* fake composer card */
  .fake-composer { position: relative; width: 480px; height: 120px; border-radius: 18px;
    border: 1px solid rgba(128,128,128,.35); background: rgba(255,255,255,.04);
    display: flex; align-items: flex-end; justify-content: flex-end; padding: 14px; }
  .fake-input { position: absolute; left: 18px; top: 16px; font-size: 14px; opacity: .5; }
  .send-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; border: none;
    cursor: pointer; background: linear-gradient(135deg, #0a84ff, #bf5af2); display: flex;
    align-items: center; justify-content: center; }
  .send-btn svg { display: block; }

  /* ===== effect layers (same rules as client.js) ===== */
  @property --aigw-angle { syntax: '<angle>'; inherits: false; initial-value: 180deg; }
  .aigw-root { position: fixed; pointer-events: none; z-index: 2147483000; overflow: hidden; }

  .aigw-pulse { position: absolute; border-radius: 999px; opacity: 0;
    box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 0 18px 4px rgba(100,210,255,.5);
    animation: aigw-pulse .9s ease-out forwards; }
  @keyframes aigw-pulse { 0% { opacity: .9; transform: scale(.6); }
    100% { opacity: 0; transform: scale(1.6); } }

  .aigw-edge-glow { position: absolute; inset: 0; border-radius: var(--aigw-radius, 18px);
    padding: 3.5px; opacity: 0; mix-blend-mode: screen; filter: blur(9px) saturate(1.15);
    background: conic-gradient(from var(--aigw-angle) at 50% 50%,
      #64d2ff 0deg, #0a84ff 60deg, #bf5af2 130deg, #ff375f 200deg,
      #ff9f0a 265deg, #64d2ff 360deg);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    animation: aigw-sweep 1.8s cubic-bezier(.45,.05,.35,1) .05s forwards,
      aigw-edge-fade 2s ease-out .05s forwards; }
  .aigw-edge-comet { position: absolute; inset: 0; border-radius: var(--aigw-radius, 18px);
    padding: 1.5px; opacity: 0;
    background: conic-gradient(from var(--aigw-angle) at 50% 50%,
      transparent 0deg, rgba(255,255,255,0) 40deg, rgba(255,255,255,.85) 96deg,
      rgba(100,210,255,.65) 130deg, rgba(10,132,255,.55) 160deg, rgba(191,90,242,.5) 210deg,
      rgba(255,55,95,.4) 250deg, rgba(255,159,10,.35) 280deg, transparent 330deg, transparent 360deg);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    animation: aigw-sweep 1.8s cubic-bezier(.45,.05,.35,1) .05s forwards,
      aigw-edge-fade 2s ease-out .05s forwards; }
  @keyframes aigw-sweep { from { --aigw-angle: 180deg; } to { --aigw-angle: 900deg; } }
  @keyframes aigw-edge-fade { 0% { opacity: 0; } 12% { opacity: .55; } 75% { opacity: .45; }
    100% { opacity: 0; } }
</style>
</head>
<body>
  <h1>Siri Apple Intelligence Light — 输入框跑马灯演示</h1>
  <p class="hint">点击按钮或发送键预览;实际插件在 DeepSeek Harness 里随发送触发</p>
  <div class="controls">
    <button id="btn-fire">▶ 触发跑马灯</button>
  </div>
  <div class="fake-composer" id="card">
    <span class="fake-input">输入消息…</span>
    <button class="send-btn" id="send" title="发送">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>

<script>
  let activeRoot = null, activeTimer = 0;
  const mk = c => { const d = document.createElement('div'); d.className = c; return d; };
  function dismiss() {
    if (activeTimer) { clearTimeout(activeTimer); activeTimer = 0; }
    if (activeRoot && activeRoot.parentNode) activeRoot.parentNode.removeChild(activeRoot);
    activeRoot = null;
  }
  function addPulse(root, btn, r) {
    const b = btn.getBoundingClientRect();
    const p = mk('aigw-pulse');
    const size = Math.max(b.width, b.height) * 1.6;
    p.style.width = size + 'px'; p.style.height = size + 'px';
    p.style.left = (b.left - r.left + b.width / 2 - size / 2) + 'px';
    p.style.top = (b.top - r.top + b.height / 2 - size / 2) + 'px';
    root.appendChild(p);
  }
  function fire() {
    const card = document.getElementById('card');
    const btn = document.getElementById('send');
    const r = card.getBoundingClientRect();
    dismiss();
    const root = mk('aigw-root');
    root.style.left = r.left + 'px'; root.style.top = r.top + 'px';
    root.style.width = r.width + 'px'; root.style.height = r.height + 'px';
    root.style.overflow = 'hidden';
    root.style.setProperty('--aigw-radius', '18px');
    root.style.borderRadius = '18px';
    root.appendChild(mk('aigw-edge-glow'));
    root.appendChild(mk('aigw-edge-comet'));
    addPulse(root, btn, r);
    document.body.appendChild(root);
    activeRoot = root;
    activeTimer = setTimeout(dismiss, 2400);
  }
  document.getElementById('btn-fire').onclick = fire;
  document.getElementById('send').onclick = fire;
</script>
</body>
</html>
